{% extends "base.html" %}

{% block title %}{% if mode == 'edit' %}Ubah Event - Agenda{% else %}Tambah Event Baru - Agenda{% endblock %}

{% block content %}
<div class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 lg:p-8 overflow-y-auto">

    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('pages.dashboard') }}" class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-700 bg-white border border-slate-200 px-3.5 py-1.5 rounded-lg shadow-xs transition">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span>Kembali ke Kalender</span>
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
        <h1 class="text-xl font-bold text-slate-900 mb-6">
            {% if mode == 'edit' %}Ubah Event{% else %}Tambah Event Baru{% endif %}
        </h1>

        <form id="standaloneEventForm" class="flex flex-col gap-4">
            <input type="hidden" id="pageEventId" value="{{ event.id if event else '' }}">

            <div>
                <label for="pageTitleInput" class="block text-xs font-semibold text-slate-700 mb-1">Judul Event <span class="text-rose-500">*</span></label>
                <input type="text" id="pageTitleInput" required maxlength="120"
                    value="{{ event.title if event else '' }}"
                    placeholder="Contoh: Rapat Evaluasi Proyek"
                    class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <span id="pageTitleError" class="text-rose-500 text-xs hidden mt-1"></span>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="pageAllDayInput" {% if event and event.all_day %}checked{% endif %} class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                <label for="pageAllDayInput" class="text-xs font-medium text-slate-700 cursor-pointer">Sepanjang hari</label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="pageStartInput" class="block text-xs font-semibold text-slate-700 mb-1">Waktu Mulai <span class="text-rose-500">*</span></label>
                    <input type="datetime-local" id="pageStartInput" required
                        class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="pageEndInput" class="block text-xs font-semibold text-slate-700 mb-1">Waktu Selesai</label>
                    <input type="datetime-local" id="pageEndInput"
                        class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <span id="pageTimeError" class="text-rose-500 text-xs hidden mt-1"></span>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="pageCategorySelect" class="block text-xs font-semibold text-slate-700 mb-1">Kategori</label>
                    <select id="pageCategorySelect" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="">Tanpa Kategori</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if event and event.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="pagePrioritySelect" class="block text-xs font-semibold text-slate-700 mb-1">Prioritas</label>
                    <select id="pagePrioritySelect" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="rendah" {% if event and event.priority == 'rendah' %}selected{% endif %}>Rendah</option>
                        <option value="sedang" {% if not event or event.priority == 'sedang' %}selected{% endif %}>Sedang</option>
                        <option value="tinggi" {% if event and event.priority == 'tinggi' %}selected{% endif %}>Tinggi</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="pageLocationInput" class="block text-xs font-semibold text-slate-700 mb-1">Lokasi</label>
                <input type="text" id="pageLocationInput" value="{{ event.location if event else '' }}"
                    placeholder="Contoh: Gedung A Lantai 2"
                    class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label for="pageDescInput" class="block text-xs font-semibold text-slate-700 mb-1">Catatan</label>
                <textarea id="pageDescInput" rows="3" placeholder="Rincian catatan..."
                    class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ event.description if event else '' }}</textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-2">Pengingat (Notifikasi)</label>
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-700">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="pageReminderOffset" value="0" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>Saat mulai</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="pageReminderOffset" value="10" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>10 menit sebelumnya</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="pageReminderOffset" value="30" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>30 menit sebelumnya</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="pageReminderOffset" value="60" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>1 jam sebelumnya</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="pageReminderOffset" value="1440" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>1 hari sebelumnya</span>
                    </label>
                </div>
            </div>

            <div class="pt-5 border-t border-slate-100 flex items-center justify-end gap-3">
                <a href="{{ url_for('pages.dashboard') }}" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Batal</a>
                <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition">
                    Simpan
                </button>
            </div>
        </form>
    </div>

</div>

<script>
    {% if event %}
    // Inisialisasi datetime untuk edit
    (function() {
        const startRaw = "{{ event.start_at }}";
        const endRaw = "{{ event.end_at or '' }}";
        if (startRaw) {
            const d = new Date(startRaw);
            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById('pageStartInput').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        if (endRaw) {
            const d = new Date(endRaw);
            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById('pageEndInput').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        // Centang pengingat yang ada
        {% for r in event.reminders %}
        const cb{{ loop.index }} = document.querySelector(`input[name="pageReminderOffset"][value="{{ r.offset_minutes }}"]`);
        if (cb{{ loop.index }}) cb{{ loop.index }}.checked = true;
        {% endfor %}
    })();
    {% else %}
    // Default waktu mulai: jam berikutnya
    (function() {
        const now = new Date();
        now.setHours(now.getHours() + 1, 0, 0, 0);
        const pad = (n) => String(n).padStart(2, '0');
        const startStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
        document.getElementById('pageStartInput').value = startStr;
        now.setHours(now.getHours() + 1);
        const endStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
        document.getElementById('pageEndInput').value = endStr;
    })();
    {% endif %}

    document.getElementById('standaloneEventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('pageEventId').value;
        const title = document.getElementById('pageTitleInput').value.trim();
        const start_at = document.getElementById('pageStartInput').value;
        const end_at = document.getElementById('pageEndInput').value || null;
        const all_day = document.getElementById('pageAllDayInput').checked;
        const category_id = document.getElementById('pageCategorySelect').value || null;
        const priority = document.getElementById('pagePrioritySelect').value;
        const location = document.getElementById('pageLocationInput').value.trim();
        const description = document.getElementById('pageDescInput').value.trim();

        // Validasi waktu selesai tidak boleh lebih awal dari mulai
        if (!all_day && end_at && new Date(end_at) < new Date(start_at)) {
            const err = document.getElementById('pageTimeError');
            err.textContent = 'Waktu selesai tidak boleh lebih awal dari waktu mulai.';
            err.classList.remove('hidden');
            return;
        }

        const reminders = [];
        document.querySelectorAll('input[name="pageReminderOffset"]:checked').forEach(cb => {
            reminders.push(parseInt(cb.value));
        });

        const payload = {
            title,
            start_at: new Date(start_at).toISOString(),
            end_at: end_at ? new Date(end_at).toISOString() : null,
            all_day,
            category_id: category_id ? parseInt(category_id) : null,
            priority,
            location,
            description,
            reminders
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/events/${id}` : '/api/events';

        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                window.location.href = "{{ url_for('pages.dashboard') }}";
            } else {
                const data = await res.json();
                alert(data.message || 'Gagal menyimpan event.');
            }
        } catch (err) {
            alert('Terjadi kesalahan jaringan.');
        }
    });
</script>
{% endblock %}
