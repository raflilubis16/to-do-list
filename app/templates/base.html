<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}To Do List - Kalender & Pengingat{% endblock %}</title>

    <!-- Tailwind CSS (CDN for reliable full utility support) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Inter Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- FullCalendar CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <!-- App Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col font-sans antialiased text-slate-800 bg-slate-50 selection:bg-indigo-500 selection:text-white">

    <!-- Top Bar Navigation (Sesuai Wireframe Bab 9) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand / Logo -->
            <div class="flex items-center gap-3">
                <a href="{{ url_for('pages.dashboard') }}" class="flex items-center gap-2.5 text-indigo-600 hover:text-indigo-700 transition">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-calendar-check text-lg"></i>
                    </div>
                    <div>
                        <span class="text-xl font-bold tracking-tight text-slate-900">Agenda</span>
                        <span class="hidden sm:inline-block text-xs font-medium text-slate-400 ml-1.5 px-2 py-0.5 rounded-full bg-slate-100">v1.0 MVP</span>
                    </div>
                </a>
            </div>

            <!-- Search Bar (Live Filter) -->
            <div class="flex-1 max-w-md mx-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="globalSearchInput"
                        placeholder="Cari event atau lokasi..."
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                        autocomplete="off">
                </div>
            </div>

            <!-- Actions & Links -->
            <div class="flex items-center gap-3">
                <!-- Tombol Pengaturan -->
                <a href="{{ url_for('pages.settings') }}" title="Pengaturan & Kategori"
                    class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition"
                    aria-label="Pengaturan">
                    <i class="fa-solid fa-gear text-lg"></i>
                </a>

                <!-- Tombol Aksi Utama: + Event Baru -->
                <button type="button" id="openNewEventModalBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg px-4 py-2 shadow-sm transition inline-flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>+ Event baru</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-hidden flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container (Kanan-Bawah sesuai Bab 9) -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full">
        <!-- Toast items injected via notifications.js -->
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
